name: Auto-Merge Trigger

# Native merge-queue cutover: retires .mergify.yml. Mergify's own pull_request_rules "queue on
# green + threads resolved" rule did two jobs at once -- (1) admitting a PR into its queue once
# every check-success/thread-resolved/author condition held, and (2) actually performing the
# merge. GitHub's native `merge_queue` ruleset rule (added to sunto's "main-protection" ruleset
# alongside this PR) replaces job (2), but has no author-based admission control of its own --
# something still has to call `gh pr merge` per PR, gated the same way Mergify's own rule was.
#
# This repo is PUBLIC with required_approving_review_count: 0 -- the trusted-author gate below
# is not cosmetic. Without it, any outside contributor's PR that went green on both required
# checks would auto-merge with zero human review. Mergify's own condition list (this repo's now-
# superseded .mergify.yml) only ever admitted two cases: `author = thagale`, or a Dependabot PR
# that (a) isn't labeled `needs-review` and (b) has a green `auto-merge` check-run (produced by
# dependabot-auto-merge.yml's own classify step, which labels major bumps `needs-review` and
# leaves minor/patch bumps unlabeled and auto-approved). Ported here exactly -- no
# catalyst-cloud-connector[bot] entry (unlike some other repos in this fleet) since sunto's
# Mergify config never had one.
#
# `needs-review`, not `needs-human`: this repo already had that label name from its pre-
# migration Mergify config (applied to Dependabot major bumps, and available as a general
# manual pause), so the native port keeps the existing name rather than introducing a second
# one with the same role.
#
# Mergify re-evaluated its conditions continuously (any relevant status change, not just a PR
# event), which is why the `workflow_run` trigger below exists: `dependabot-auto-merge.yml`'s
# own classify step runs concurrently with (not before) this workflow's `pull_request_target`
# run on the same `opened`/`synchronize` event, so its `auto-merge` check-run is frequently
# still absent/in-progress the moment this job checks it. Without a second, completion-
# triggered path, a minor/patch Dependabot PR that gets classified a few seconds AFTER this
# job already stood down would never be re-evaluated by anything -- no further PR-lifecycle
# event occurs just because a sibling workflow finished.
on:
  pull_request_target:
    branches: [main]
    # unlabeled/labeled (needs-review only, scoped in the job's own if: below): a maintainer
    # manually applying or removing needs-review as an out-of-band pause needs to reach this
    # job the same way an opened/synchronize event does, or the visible pause/resume signal is
    # cosmetic and the PR can still merge (or stays stuck) regardless.
    types: [opened, reopened, ready_for_review, synchronize, edited, unlabeled, labeled]
  workflow_run:
    workflows: ['Dependabot Auto-Merge']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read

jobs:
  auto-merge:
    # `edited` scoped to a real base retarget only: `edited` fires on ANY PR edit (title, body,
    # labels, base), but this job calls `gh pr merge` unconditionally for it, which could re-arm
    # an unchanged head that just failed merge-group CI for reasons having nothing to do with
    # that edit. `changes.base` is present on the edited event's payload only when the base
    # branch itself changed.
    #
    # A matching `labeled`/`unlabeled` event (needs-review only) bypasses the author allowlist
    # below -- queue-retry-handler.yml retries an already-admitted PR the same way regardless of
    # author, and a needs-review pause/resume on one of those PRs needs to reach this job the
    # same as an allowlisted one's. Coarse author check here is the webhook-delivery-time
    # snapshot (good enough to skip obviously-ineligible PRs cheaply); the Dependabot branch's
    # finer check-success=auto-merge condition is re-verified live inside auto-merge-once.sh,
    # since a job-level `if:` cannot evaluate a check-run's live conclusion.
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null) &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'needs-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'needs-review') &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'needs-review') ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'needs-review') ||
        (
          github.event.pull_request.user.login == 'thagale' ||
          github.event.pull_request.user.login == 'dependabot[bot]'
        )
      )
    runs-on: ubuntu-latest
    # Shared with queue-retry-handler.yml's own mutating job AND the retrigger job below --
    # closes a TOCTOU race where any one of these could read needs-review as absent and merge
    # moments after another handed the PR to a human. cancel-in-progress: false: a shared
    # mutual-exclusion lock must let a queued run WAIT for the current holder to finish its
    # full read-decide-act sequence, never cancel it mid-mutation.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # CODEX_REVIEW_PAT, not GITHUB_TOKEN: a merge attributed to GITHUB_TOKEN suppresses
      # downstream push-triggered events (GitHub's anti-recursion guard) -- any push-triggered
      # workflow needs to fire for a queue-merged commit exactly like any other push to main.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Handle a manual needs-review label/unlabel event
        if: github.event.action == 'labeled' || github.event.action == 'unlabeled'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event.action }}" = "labeled" ]; then
            echo "::notice::needs-review was just attached to PR #$PR -- disarming any auto-merge that was already armed from an earlier event."
            gh pr merge "$PR_URL" --disable-auto >/dev/null 2>&1 || true
            OWNER_PART="${REPO%%/*}"; NAME_PART="${REPO##*/}"
            queue_state=$(gh api graphql -f query='query($owner: String!, $name: String!, $pr: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $pr) { id isInMergeQueue } } }' -f owner="$OWNER_PART" -f name="$NAME_PART" -F pr="$PR" 2>/dev/null)
            pr_node_id=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.id')
            in_queue=$(printf '%s' "$queue_state" | jq -r '.data.repository.pullRequest.isInMergeQueue')
            if [ "$in_queue" = "true" ] && [ -n "$pr_node_id" ] && [ "$pr_node_id" != "null" ]; then
              gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -f id="$pr_node_id" >/dev/null 2>&1 || true
            fi
          else
            echo "::notice::needs-review was just removed from PR #$PR -- falling through to a normal admission attempt below."
          fi
      # needs-review is checked (again) here, inside auto-merge-once.sh, via a fresh API fetch
      # -- not in this job's own `if:` -- because `github.event.pull_request.labels` is a
      # webhook-delivery-time snapshot, not a live read.
      - name: Enable auto-merge
        # Skip the whole attempt when this was just a `labeled: needs-review` pause -- the
        # step above already disarmed; running the admission attempt too would immediately
        # try to re-check/re-arm against a label that (correctly) blocks it, which is
        # harmless but redundant. `unlabeled` DOES fall through (removing the pause should
        # trigger a fresh attempt).
        if: '!(github.event.action == ''labeled'' && github.event.label.name == ''needs-review'')'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/auto-merge-once.sh

  # Retrigger admission once Dependabot's own classify workflow completes -- see this file's
  # own header comment for why this is necessary (the two workflows run concurrently off the
  # same PR event, so the first pass frequently finds the 'auto-merge' check-run still
  # absent/in-progress, and nothing else re-evaluates once it finishes).
  retrigger-after-dependabot-classify:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    concurrency:
      # PR number isn't in the workflow_run payload directly -- resolved inside the step
      # below via the run's own associated pull_requests, but the concurrency group needs a
      # `github`-context expression, so it keys on the workflow_run's own id instead. This
      # doesn't share the auto-merge-${{ PR }} lock other jobs use, but the step below still
      # re-checks live state (needs-review, auto-merge check-run, merge_queue, base) right
      # before mutating, the same TOCTOU protection every other admission path relies on.
      group: retrigger-dependabot-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Resolve the associated PR and retry admission
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PAT }}
          REPO: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # github.event.workflow_run.pull_requests is populated by GitHub for a same-repo PR
          # (Dependabot PRs always are -- never a fork), but fetch fresh via the run's own head
          # SHA regardless, rather than trusting the webhook-delivery-time array, since a
          # retry/rerun of the classify workflow could be evaluating an already-superseded head.
          HEAD_SHA=$(gh api "repos/${REPO}/actions/runs/${WORKFLOW_RUN_ID}" --jq '.head_sha')
          PR=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '[.[] | select(.state == "open")] | first | .number // empty')
          if [ -z "$PR" ]; then
            echo "::notice::No open PR found for commit $HEAD_SHA (already merged/closed, or not a PR head) -- nothing to retrigger."
            exit 0
          fi
          PR_URL=$(gh pr view "$PR" --repo "${REPO}" --json url --jq .url)
          PR_AUTHOR=$(gh pr view "$PR" --repo "${REPO}" --json author --jq .author.login)
          PR_HEAD_SHA=$(gh pr view "$PR" --repo "${REPO}" --json headRefOid --jq .headRefOid)
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            echo "::notice::PR #$PR's author ($PR_AUTHOR) is not dependabot[bot] -- this retrigger path only ever applies to Dependabot PRs, standing down."
            exit 0
          fi
          export PR PR_URL PR_AUTHOR PR_HEAD_SHA
          bash .github/scripts/auto-merge-once.sh
